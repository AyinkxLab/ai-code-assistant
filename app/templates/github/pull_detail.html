{% extends "base.html" %}

{% block title %}PR #{{ number }} - {{ owner }}/{{ repo }} - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="github-header">
  <div>
    <h1><a class="repo-breadcrumb" href="{{ url_for('github.repos') }}">Repositories</a> / <a class="repo-breadcrumb" href="{{ url_for('github.repo_detail', owner=owner, repo=repo) }}">{{ owner }}/{{ repo }}</a> / <a class="repo-breadcrumb" href="{{ url_for('github.pulls', owner=owner, repo=repo) }}">Pull Requests</a> / #{{ number }}</h1>
  </div>
</div>

<div id="pull-detail" class="issue-detail"><p class="sidebar-empty">Loading pull request...</p></div>
<section id="pull-checks" class="pull-files" aria-live="polite"></section>
<div id="pull-files" class="pull-files"></div>

<div class="analyze-panel">
  <button id="analyze-pr" class="btn btn-primary" type="button">Review with AI</button>
  <div id="pr-analysis" class="analysis-output" hidden></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/github.js') }}"></script>
<script src="{{ url_for('static', filename='js/github_pull.js') }}"></script>
{% endblock %}
