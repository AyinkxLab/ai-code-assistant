[project]
name = "ai-code-assistant"
version = "0.1.0"
description = "A production-grade AI coding assistant built with Flask, PostgreSQL, Docker, and vanilla JS."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "SQLAlchemy==2.1.9",
    "psycopg2-binary==2.9.13",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.3.0",
    "WTForms==3.3.2",
    "email-validator==2.4.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "cryptography==50.0.2",
    "packaging==26.4",
    "py7zr==1.1.4",
    "rarfile==4.5",
    "Flask-SocketIO==5.7.2",
    "simple-websocket==1.1.0",
    "fpdf2==2.9.0",
    "PyYAML==6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"
