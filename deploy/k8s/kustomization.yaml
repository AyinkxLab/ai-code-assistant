apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aica

resources:
  - namespace.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml
  - migration-job.yaml

# Pin the deployed image here, or override it with
# `kustomize edit set image ghcr.io/ayinkxlab/ai-code-assistant=<repo>:<tag>`.
images:
  - name: ghcr.io/ayinkxlab/ai-code-assistant
    newTag: 0.1.0
