apiVersion: apps/v1
kind: Deployment
metadata:
  name: aica-web
  labels:
    app.kubernetes.io/name: aica-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ai-code-assistant
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aica-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aica-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ai-code-assistant
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/ayinkxlab/ai-code-assistant:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - "--bind=0.0.0.0:5000"
            - "--workers=3"
            - "--timeout=120"
            - "--graceful-timeout=30"
            - "--access-logfile=-"
            - "wsgi:app"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: aica-secrets
                optional: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      # The image runs as uid 1000 and writes only to /tmp; the application's
      # data lives in PostgreSQL, so no application volume is mounted.
