apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aica-web
  labels:
    app.kubernetes.io/name: aica-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ai-code-assistant
  annotations:
    # Chat responses stream over SSE; buffering would delay deltas.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Bounded to the application's project import limits.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - assistant.example.com
      secretName: aica-tls
  rules:
    - host: assistant.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aica-web
                port:
                  name: http
