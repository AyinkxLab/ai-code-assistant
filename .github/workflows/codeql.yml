name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off the hour so the run does not join the top-of-hour load
    # spike. The schedule re-analyses the default branch so that advisories
    # published after a commit are still picked up.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# The workflow itself only reads the repository. The `analyze` job adds
# `security-events: write` because uploading SARIF results to the code
# scanning backend requires it.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `python`      -> the Flask application under app/
        # `javascript`  -> the vanilla JS front end under app/static/js
        # `actions`     -> the workflow files in .github/workflows
        language: [python, javascript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds the high-precision/expensive queries on
          # top of the default suite. Findings are reported in the Security
          # tab rather than failing the build, so the extra coverage costs
          # runner minutes but does not block contributors.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
