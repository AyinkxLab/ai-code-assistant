name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default.
#
# Every job below only needs to read the repository, so the workflow-level
# default is `contents: read` and nothing else. Each job repeats the value so
# that a job added later cannot silently inherit a wider scope, and so a
# reviewer can read the token scope of each job without cross-referencing.
#
# Deliberate constraints (enforced by scripts/check_assets.py):
#   * No `pull_request_target` and no `workflow_run`. Both are privileged
#     triggers; combined with checking out pull-request code they let a fork
#     run arbitrary code with repository write access and secrets.
#   * No `secrets.*`. CI must work for anonymous fork pull requests, which
#     never receive repository secrets, and no CI job needs one.
#   * Every third-party action is pinned to a full commit SHA. A tag can be
#     moved by whoever owns the action repository; a SHA cannot.
#   * `actions/checkout` runs with `persist-credentials: false` so the
#     GITHUB_TOKEN is not written into `.git/config`, where the pull
#     request's own test code could read it.
permissions:
  contents: read

# Cancel superseded runs for the same ref. Without this, a burst of pushes
# (or a pull request that pushes repeatedly) can queue up unbounded runner
# minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # Hash both manifests: CI installs requirements-dev.txt, so the
          # cache key must change when either file changes.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

  asset-guard:
    name: Asset & VS Code guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Defence-in-depth against the fake-font payload and folderOpen VS Code
      # task that were previously shipped in this repository, plus the
      # workflow/dependency/Dockerfile checks described in
      # scripts/check_assets.py.
      - name: Check for malicious assets and auto-run tasks
        run: python scripts/check_assets.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: testing
        run: |
          pytest --cov=app --cov-report=term-missing

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test - --run

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aica
          POSTGRES_PASSWORD: aica
          POSTGRES_DB: aica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aica -d aica_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql://aica:aica@localhost:5432/aica_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Parity run for the chat module on PostgreSQL (issue #20). The chat
      # suite must keep >85% coverage of the chat service/API/model modules.
      - name: Run chat tests on PostgreSQL
        run: >
          pytest
          tests/test_chat.py
          tests/test_chat_api.py
          tests/test_chat_attachments.py
          tests/test_chat_cancel_generation.py
          tests/test_chat_settings.py
          tests/test_chat_audit.py
          tests/test_chat_onboarding.py
          tests/test_chat_project_files.py
          tests/test_chat_coverage.py
          tests/test_llm_cache.py
          tests/test_token_usage.py
          tests/test_api_keys.py
          tests/test_providers.py
          tests/test_crypto.py
          tests/test_models.py
          --cov=app.chat
          --cov=app.models.message
          --cov=app.models.conversation
          --cov=app.services.llm_cache
          --cov-report=term-missing
          --cov-fail-under=85

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # `push: false` keeps the image on the runner only. The GHA build cache
      # is scoped to the workflow's ref, so a pull request can only write to
      # its own merge-ref scope and cannot poison the `main` branch cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ai-code-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
